<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex Shield Base -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" fill="#0b0f19" stroke="url(#cyberGrad)" stroke-width="3" />
  
  <!-- Orbit Circuit Rings -->
  <ellipse cx="50" cy="50" rx="36" ry="16" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" transform="rotate(-25 50 50)" />
  <ellipse cx="50" cy="50" rx="36" ry="16" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" transform="rotate(35 50 50)" />

  <!-- Core ZK Shield / Iris -->
  <path d="M50 25 L70 38 V62 L50 75 L30 62 V38 Z" fill="url(#cyberGrad)" opacity="0.25" />
  <path d="M50 25 L70 38 V62 L50 75 L30 62 V38 Z" stroke="url(#neonGlow)" stroke-width="2" filter="url(#glow)" />

  <!-- Quantum Core Nodes -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#6366f1" />
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="6" r="3" fill="#10b981" />
  <circle cx="88" cy="26" r="3" fill="#6366f1" />
  <circle cx="88" cy="74" r="3" fill="#8b5cf6" />
  <circle cx="50" cy="94" r="3" fill="#06b6d4" />
  <circle cx="12" cy="74" r="3" fill="#10b981" />
  <circle cx="12" cy="26" r="3" fill="#6366f1" />
</svg>
