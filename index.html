<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/midnight.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivateAid Counter — Zero-Knowledge Privacy DApp on Midnight Network</title>
    <meta name="description" content="Confidential zero-knowledge state transitions on Midnight Network with browser proof generation." />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CDN with custom extended theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Syne', 'sans-serif'],
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              midnight: {
                950: '#030712',
                900: '#070d1e',
                800: '#0c142b',
                700: '#142145',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#030712] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
